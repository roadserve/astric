name: all_crm
description: AI SME Copilot App - Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^12.1.3
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  
  # UI Components
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  
  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Barcode & Camera
  mobile_scanner: ^5.2.3
  camera: ^0.10.5+5
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  geolocator: ^10.1.0
  image_picker: ^1.0.4
  path_provider: ^2.1.2
  url_launcher: ^6.2.2
  
  # HTTP & JSON
  http: ^1.1.2
  json_annotation: ^4.8.1
  
  # Charts
  fl_chart: ^0.66.0
  
  # Date & Time
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
